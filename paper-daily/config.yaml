      - haptic
      - force feedback
      - force/torque
      - contact-rich
    human_robot_transfer:
      - human video
      - human demonstration
      - egocentric video
      - observational learning
      - one-shot visual imitation
      - video-to-robot
      - human-to-robot
      - cross-embodiment
    whole_body_humanoid:
