sources:
  arxiv:
    enabled: true
    lookback_days: 2
    max_results: 500
    retries: 1
    retry_after_seconds: 20
    historical_per_category: 200
    historical_api_sleep_seconds: 3
    html_fallback_enabled: true
    max_api_failures_before_html: 1
    html_fallback_per_category: 200
    html_fallback_max_results: 500
    html_fallback_sleep_seconds: 0.25
  official_organization_channels:
    enabled: true
    check_each_run: true
    role: supplemental_candidate_feed
    organizations:
      - Physical Intelligence / OpenPI
      - NVIDIA Robotics
      - Tesla Optimus
      - X Square Robot
      - AGIBOT
      - LingBot
      - Unitree Robotics
      - LimX Dynamics
      - RobotEra
      - EngineAI
      - Genesis AI
      - Sharpa
      - Figure AI
      - 1X Technologies
      - Skild AI
      - Generalist AI
      - Boston Dynamics
      - Galbot
      - Spirit AI
      - Astribot
      - Galaxea AI
      - PsiBot
      - WUJI Technology
      - Tencent Robotics X
    accepted_channels:
      - official research or publication page
      - official project page with a direct paper PDF
      - official GitHub organization or repository release
      - official Hugging Face organization model card linked to a paper
    discovery_only_channels:
      - search engine results
      - news media
      - social reposts
    acceptance_rules:
      require_full_paper_or_technical_report: true
      require_authors_and_affiliations: true
      require_publication_date_in_window: true
      require_method_and_experiment_details: true
      product_announcement_without_paper_is_not_candidate: true
      organization_is_positive_prior_not_auto_accept: true
    deduplication:
      prefer_arxiv_as_canonical_when_available: true
      match_on_title_authors_and_project_url: true
      preserve_official_project_code_and_model_links: true
    merge_before_candidate_cap: true
    official_non_arxiv_id_prefix: "official:"
  openreview:
    enabled: false
    venues:
      - ICLR
      - NeurIPS
      - ICML
      - TMLR
      - COLM
    max_results: 100
  openalex:
    enabled: false
    lookback_days: 3
    max_results: 100
    per_page: 50
    max_auto_queries: 5
    search_queries: []
    mailto: ""
    api_key_env: OPENALEX_API_KEY
    api_key: ""

output:
  report_dir: reports
  data_dir: data
  log_dir: logs

retrieval:
  daily_candidate_limit: 200
  window_candidate_limit: null
  keyword_count_affects_priority: false

reporting:
  daily_selected_paper_limit: 5
  daily_full_text_review_limit: 10
  monday_window_selected_paper_limit: 15
  friday_window_selected_paper_limit: 20
  allow_fewer_than_target: true
  minimum_quality_over_quota: true

semantic_triage:
  labels:
    - must_fulltext_review
    - possible
    - reject
  require_primary_contribution_reason: true
  prohibit_keyword_count_scoring: true
  review_all_daily_candidates: true

personal_preference:
  tracked_organization_prior:
    enabled: true
    levels:
      - tracked-led
      - tracked-collaboration
      - none
    may_protect_daily_recall: true
    may_break_fulltext_or_selection_ties: true
    may_change_quality_evidence_scores: false
    may_override_negative_filter: false
    require_verified_affiliation_or_official_source: true

selection_calibration:
  positive_fulltext_review_examples:
    - HOST
    - tau0-VLA
    - RobotTTr
    - verified papers from tracked organizations with strong method and experiment evidence
  neutral_examples:
    - Masked Visual Actions for Unified World Modeling
  excluded_from_current_backfill:
    - T-Rex: Tactile-Reactive Dexterous Manipulation

quality_monitoring:
  required_artifacts:
    - window_candidates
    - scored_review_record
    - local_report
    - public_paper_module
    - figure_assets
    - figure_manifest
    - contact_sheet
  candidate_and_selection:
    require_daily_window_fetch: true
    require_official_channel_check: true
    require_deduplication_before_cap: true
    require_selection_and_rejection_reasons: true
    abstract_only_cannot_be_selected: true
    real_robot_default_expectation: true
    no_real_robot_exception_requires:
      - strong_transfer_value
      - sufficient_closed_loop_or_multi_benchmark_evidence
      - credible_baselines_and_ablations
      - explicit_local_downgrade_note
  selected_paper_evidence:
    require_full_text_version: true
    require_affiliation_source: true
    require_key_claim_locations: true
    require_verified_resource_links: true
    require_method_data_experiment_and_limitation_review: true
  content_gates:
    six_quick_cards_must_be_distinct: true
    experiment_card_requires:
      - setup
      - direct_baseline
      - key_result
      - evidence_boundary
    detailed_experiment_requires:
      - trials_or_explicitly_not_reported
      - success_criterion_or_explicitly_not_reported
      - ablations_or_explicitly_missing
      - generalization_or_explicitly_missing
    reproducibility_requires_effective_details_not_boilerplate: true
    exact_claims_must_be_source_traceable: true
    taxonomy_requires_primary_contribution_recheck: true
  cross_artifact_consistency:
    selected_ids_equal_public_paper_ids: true
    selected_ids_equal_manifest_paper_ids: true
    selected_count_equal_report_count: true
    manifest_must_be_registered_in_website_test: true
  validation:
    require_python_tests: true
    require_website_tests: true
    require_git_diff_check: true
    require_contact_sheet_visual_review: true
  deployment:
    reuse_existing_sites_project: true
    exact_validated_website_tree: true
    archive_matches_pushed_commit: true
    poll_until_terminal: true
    require_succeeded_status: true
    verify_report_and_paper_routes_after_publish: true
    never_push_github_origin: true

figure_quality:
  figures_per_selected_paper:
    minimum: 1
    maximum: 2
  source_priority:
    - arxiv HTML standalone figure asset
    - arxiv source package original figure asset
    - official paper or project-page figure asset
    - exact PDF figure bounding-box crop
  minimum_width_px: 700
  minimum_height_px: 180
  reject_if:
    - paper title authors or page number are visible
    - any panel label legend or diagram branch is clipped
    - figure is mostly body text caption or whitespace
    - figure number or caption does not match the source paper
    - image is a results-only table or unrelated rollout photo
  require_source_url_and_figure_number: true
  require_contact_sheet_visual_review: true
  require_quality_manifest: true
  on_failure: do_not_publish_the_figure_or_paper_entry

selection_policy:
  primary_contribution_only: true
  organization_is_positive_prior_not_auto_accept: true
  reference_examples_dir: ../../ref
  reject_scenario_specific_system_papers:
    - medical and surgical systems
    - mining systems
    - laboratory automation
  reject_navigation_only_papers:
    - embodied question answering navigation
    - object navigation
    - traversability mapping
    - navigation-only representation learning
  transferable_memory_or_representation_alone_is_not_an_exception: true
  require_clear_method_transfer_for_adjacent_fields: true
  website_hides_internal_scores: true

paper_taxonomy:
  research_direction:
    single_primary: true
    values:
      - VLA
      - WAM
      - WM
      - Representation Learning
      - Memory
      - CoT
      - Subtask
      - Other
    memory_details_are_not_categories: true
    memory_detail_fields:
      - implementation_form
      - time_horizon
  training_and_optimization:
    single_primary: true
    values:
      - Pre-training
      - Post-training
      - BC
      - RL
      - Test-time Adaptation
    rules:
      fine_tuning: Post-training
      supervised_robot_action_learning: BC
      dagger: Online Data / Human Correction
      planning_and_search: detail_only
      inference_optimization: detail_only
  innovation_modality:
    classify_only_if_central_to_novelty: true
    omit_default_modalities:
      - RGB
      - Language
    values:
      - Depth / RGB-D
      - Point Cloud / 3D
      - Force / Torque
      - Tactile
      - Audio
      - Mask / Segmentation
      - State / Proprioception
      - Other Modality
  data_method:
    classify_only_if_central_to_novelty: true
    values:
      - Data Quality / Selection
      - Data Augmentation
      - Synthetic / Simulation Data
      - Online Data / Human Correction
      - UMI / Ego / Human Video
      - Cross-embodiment Data
      - Other Data Method
  robot_platform:
    combinable: true
    values:
      - Manipulator
      - Humanoid
      - Wheeled Base
      - Dexterous Hand
      - Gripper
      - Other Platform
  deployment_and_transfer:
    single_primary: true
    classify_only_if_central_to_contribution: true
    values:
      - Real-robot Deployment Optimization
      - Sim2Real
      - Real2Sim
      - Real2Sim2Real
      - Cross-embodiment Transfer
    real_robot_deployment_optimization:
      requires_direct_experiment: true
      real_robot_evaluation_alone_is_insufficient: true
      qualifying_contributions:
        - on-device latency or throughput
        - model compression or inference acceleration
        - control-frequency optimization
        - sensor removal or deployment-time sensor reduction
        - compute or memory reduction
        - online recovery or safety degradation handling

content_policy:
  quick_cards:
    - motivation
    - method
    - model_structure
    - data_composition
    - experiments_and_conclusion
    - improvement_over_baseline
  summary_cards:
    - strengths
    - limitations
    - transferable_ideas
  experiment_evidence:
    required_fields:
      - setup
      - comparisons
      - key_results
      - evidence_boundary
    include_when_reported:
      - task_and_dataset
      - robot_platform
      - trial_count
      - success_criterion
      - ablations
      - generalization_split
      - variance_or_confidence_interval
    never_infer_exact_values_from_plots: true
  reproducibility:
    format: continuous_prose
    include:
      - network_and_hyperparameter_details
      - verified_code_model_and_data_status
      - information_not_disclosed_by_paper
    verify_links_before_publishing: true
    do_not_pad_missing_details: true
  detailed_reading:
    position: after_strengths_limitations_transfer
    format: vertical_prose_without_card_grid
    sections:
      - technical_details
      - experiments_and_ablations
      - reproducibility
    technical_details_cover:
      - information_flow_and_key_modules
      - training_objective_or_inference_process
      - important_equations_when_present_and_useful
    formulas_use_readable_math_not_raw_latex: true
    source_facts_only_no_editorial_opinion: true
    hide_generation_instructions_and_disclaimers_from_website: true
    require_traceable_source_for_every_number_formula_and_architecture_detail: true

semantic_scoring:
  weights:
    methodological_relevance: 0.20
    inspiration_value: 0.16
    transferability_to_my_research: 0.16
    experimental_evidence: 0.18
    paper_quality: 0.12
    novelty_timeliness: 0.10
    actionability: 0.08
  experimental_evidence:
    require_real_robot_for_high_score: true
    require_targeted_ablations_for_high_score: true
    reward_generalization_or_complex_tasks: true
    verify_trial_counts_and_success_criteria: true
    penalize_demo_only_evidence: true
    penalize_unfair_data_compute_or_backbone_comparisons: true
  report_requirements:
    include_affiliations_for_selected_papers: true
    affiliation_primary_source: pdf_first_page
    disclose_unknown_lab_names: true
    selected_paper_sections:
      - concise_summary
      - motivation
      - method
      - model_structure
      - data_composition
      - experiments_and_results
      - improvement_over_baseline
      - strengths_limitations_and_transfer
      - technical_details
      - experiments_and_ablations
      - reproducibility_information
      - score_breakdown
