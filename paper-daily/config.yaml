sources:
  arxiv:
    enabled: true
    lookback_days: 2
    max_results: 300
    retries: 0
    retry_after_seconds: 20
    html_fallback_enabled: true
    max_api_failures_before_html: 1
    html_fallback_per_category: 100
    html_fallback_max_results: 300
    html_fallback_sleep_seconds: 0.25
  openreview:
    enabled: false
    venues:
      - ICLR
      - NeurIPS
      - ICML
      - TMLR
      - COLM
    max_results: 100
  openalex:
    enabled: false
    lookback_days: 3
    max_results: 100
    per_page: 50
    max_auto_queries: 5
    search_queries: []
    mailto: ""
    api_key_env: OPENALEX_API_KEY
    api_key: ""

output:
  report_dir: reports
  data_dir: data
  log_dir: logs

retrieval:
  candidate_limit: 300

reporting:
  selected_paper_count: 15
  full_text_review_limit: 30
  allow_fewer_than_target: true
  minimum_quality_over_quota: true

selection_policy:
  primary_contribution_only: true
  organization_is_positive_prior_not_auto_accept: true
  reference_examples_dir: ../../ref
  reject_scenario_specific_system_papers:
    - medical and surgical systems
    - mining systems
    - laboratory automation
  reject_navigation_only_papers:
    - embodied question answering navigation
    - object navigation
    - traversability mapping
    - navigation-only representation learning
  transferable_memory_or_representation_alone_is_not_an_exception: true
  require_clear_method_transfer_for_adjacent_fields: true
  website_hides_internal_scores: true

paper_taxonomy:
  research_direction:
    single_primary: true
    values:
      - VLA
      - WAM
      - WM
      - Representation Learning
      - Memory
      - CoT
      - Subtask
      - Other
    memory_details_are_not_categories: true
    memory_detail_fields:
      - implementation_form
      - time_horizon
  training_and_optimization:
    single_primary: true
    values:
      - Pre-training
      - Post-training
      - BC
      - RL
      - Test-time Adaptation
    rules:
      fine_tuning: Post-training
      supervised_robot_action_learning: BC
      dagger: Online Data / Human Correction
      planning_and_search: detail_only
      inference_optimization: detail_only
  innovation_modality:
    classify_only_if_central_to_novelty: true
    omit_default_modalities:
      - RGB
      - Language
    values:
      - Depth / RGB-D
      - Point Cloud / 3D
      - Force / Torque
      - Tactile
      - Audio
      - Mask / Segmentation
      - State / Proprioception
      - Other Modality
  data_method:
    classify_only_if_central_to_novelty: true
    values:
      - Data Quality / Selection
      - Data Augmentation
      - Synthetic / Simulation Data
      - Online Data / Human Correction
      - UMI / Ego / Human Video
      - Cross-embodiment Data
      - Other Data Method
  robot_platform:
    combinable: true
    values:
      - Manipulator
      - Humanoid
      - Wheeled Base
      - Dexterous Hand
      - Gripper
      - Other Platform
  deployment_and_transfer:
    single_primary: true
    classify_only_if_central_to_contribution: true
    values:
      - Real-robot Deployment Optimization
      - Sim2Real
      - Real2Sim
      - Real2Sim2Real
      - Cross-embodiment Transfer
    real_robot_deployment_optimization:
      requires_direct_experiment: true
      real_robot_evaluation_alone_is_insufficient: true
      qualifying_contributions:
        - on-device latency or throughput
        - model compression or inference acceleration
        - control-frequency optimization
        - sensor removal or deployment-time sensor reduction
        - compute or memory reduction
        - online recovery or safety degradation handling

content_policy:
  quick_cards:
    - motivation
    - method
    - model_structure
    - data_composition
    - experiments_and_conclusion
    - improvement_over_baseline
  summary_cards:
    - strengths
    - limitations
    - transferable_ideas
  experiment_evidence:
    required_fields:
      - setup
      - comparisons
      - key_results
      - evidence_boundary
    include_when_reported:
      - task_and_dataset
      - robot_platform
      - trial_count
      - success_criterion
      - ablations
      - generalization_split
      - variance_or_confidence_interval
    never_infer_exact_values_from_plots: true
  reproducibility:
    format: continuous_prose
    include:
      - network_and_hyperparameter_details
      - verified_code_model_and_data_status
      - information_not_disclosed_by_paper
    verify_links_before_publishing: true
    do_not_pad_missing_details: true
  detailed_reading:
    position: after_strengths_limitations_transfer
    format: vertical_prose_without_card_grid
    sections:
      - technical_details
      - experiments_and_ablations
      - reproducibility
    technical_details_cover:
      - information_flow_and_key_modules
      - training_objective_or_inference_process
      - important_equations_when_present_and_useful
    formulas_use_readable_math_not_raw_latex: true
    source_facts_only_no_editorial_opinion: true
    hide_generation_instructions_and_disclaimers_from_website: true
    require_traceable_source_for_every_number_formula_and_architecture_detail: true

semantic_scoring:
  weights:
    methodological_relevance: 0.20
    inspiration_value: 0.16
    transferability_to_my_research: 0.16
    experimental_evidence: 0.18
    paper_quality: 0.12
    novelty_timeliness: 0.10
    actionability: 0.08
  experimental_evidence:
    require_real_robot_for_high_score: true
    require_targeted_ablations_for_high_score: true
    reward_generalization_or_complex_tasks: true
    verify_trial_counts_and_success_criteria: true
    penalize_demo_only_evidence: true
    penalize_unfair_data_compute_or_backbone_comparisons: true
  report_requirements:
    include_affiliations_for_selected_papers: true
    affiliation_primary_source: pdf_first_page
    disclose_unknown_lab_names: true
    selected_paper_sections:
      - concise_summary
      - motivation
      - method
      - model_structure
      - data_composition
      - experiments_and_results
      - improvement_over_baseline
      - strengths_limitations_and_transfer
      - technical_details
      - experiments_and_ablations
      - reproducibility_information
      - score_breakdown
