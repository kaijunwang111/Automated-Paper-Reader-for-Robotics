research_profile:
  language: en
  goal: >
    Find recent embodied-intelligence papers on robot manipulation and whole-body
    control, especially VLA, world-action models, world models, reinforcement
    learning, representation learning, and efficient real-robot deployment.
    Also retain general AI methods when their ideas transfer clearly to robotics.
  background_topics:
    - embodied intelligence
    - robot manipulation
    - whole-body control
    - vision-language-action models
    - world-action models
    - world models
    - reinforcement learning
    - imitation learning
    - representation learning
    - real-robot deployment
  concept_groups:
